services:
  n8n:
    build: ./n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_RESTRICT_FILE_ACCESS_TO=/app
    volumes:
      - videos:/app/videos
      - images:/app/images
      - scripts:/app/scripts
      - n8n_data:/home/node/.n8n
      - ./n8n/input.json:/app/inputs/input.json # 테스트용 mount

  crawler:
    build: ./crawler
    environment:
      - PYTHONUNBUFFERED=1
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/news-crawler
      - CRON_SCHEDULE=0 */6 * * *
    depends_on:
      - n8n

  uploader:
    build: ./uploader
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - videos:/app/videos
      - ./uploader/resources/client_secret.json:/app/client_secret.json
      - ./uploader/resources/token.json:/app/token.json

volumes:
  videos:
  images:
  scripts:
  n8n_data:
